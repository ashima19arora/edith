<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EDITH">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17114a"/>
      <stop offset=".28" stop-color="#3d3590"/>
      <stop offset=".5" stop-color="#a5a3e6"/>
      <stop offset=".68" stop-color="#4a3f9f"/>
      <stop offset="1" stop-color="#150f42"/>
    </linearGradient>
    <pattern id="pixels" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)">
      <rect width="24" height="24" fill="#ffd93b"/>
      <rect width="12" height="12" fill="#ffb81f"/>
      <rect x="12" y="12" width="12" height="12" fill="#ffb81f"/>
    </pattern>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Night skyline, top -->
    <g fill="#120d3d" stroke="#35d0e0" stroke-width="4">
      <path d="M130 -6V52H190V-6"/>
      <path d="M215 -6V82H290V-6"/>
      <path d="M390 -6V66H470V-6"/>
    </g>
    <g fill="#ff5fa8">
      <rect x="146" y="16" width="12" height="12"/><rect x="166" y="16" width="12" height="12"/>
      <rect x="232" y="24" width="12" height="12"/><rect x="262" y="48" width="12" height="12"/>
    </g>
    <g fill="#ffd93b">
      <rect x="408" y="22" width="12" height="12"/><rect x="438" y="22" width="12" height="12"/>
      <rect x="232" y="48" width="12" height="12"/><rect x="262" y="24" width="12" height="12"/>
    </g>

    <!-- Night skyline, bottom -->
    <g fill="#120d3d" stroke-width="4">
      <path d="M-6 518V420H62V518" stroke="#ff8a2a"/>
      <path d="M84 518V452C84 418 148 418 148 452V518" stroke="#ff5fa8"/>
      <path d="M172 518V440H246V518" stroke="#35d0e0"/>
      <path d="M268 518V410H340V518" stroke="#7ee081"/>
      <path d="M362 518V360L450 460V518Z" stroke="#35d0e0"/>
      <path d="M458 518V430H518V518" stroke="#ff5fa8"/>
    </g>
    <g fill="#ffd93b">
      <rect x="20" y="444" width="12" height="12"/><rect x="108" y="462" width="16" height="16"/>
      <rect x="192" y="462" width="12" height="12"/><rect x="288" y="434" width="12" height="12"/>
      <rect x="312" y="466" width="12" height="12"/><rect x="480" y="456" width="12" height="12"/>
    </g>

    <!-- Fire-escape ladder -->
    <g stroke="#ff8a2a" stroke-width="9" fill="none">
      <path d="M46 70V300M92 70V300"/>
      <path d="M46 100H92M46 150H92M46 200H92M46 250H92"/>
    </g>

    <!-- Spider on its thread -->
    <path d="M392 -6V226" stroke="#fff" stroke-width="4"/>
    <g stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M382 240L352 214L342 192"/><path d="M402 240L432 214L442 192"/>
      <path d="M378 254H342L326 240"/><path d="M406 254H442L458 240"/>
      <path d="M380 268L350 286L342 310"/><path d="M404 268L434 286L442 310"/>
      <path d="M384 280L366 312L368 334"/><path d="M400 280L418 312L416 334"/>
    </g>
    <ellipse cx="392" cy="232" rx="13" ry="12" fill="#fff"/>
    <ellipse cx="392" cy="264" rx="20" ry="27" fill="#fff"/>

    <!-- The E -->
    <path id="e" d="M198 112H352L336 182H262L253 222H326L312 286H239L229 330H310L294 400H128Z"
      transform="translate(-26 24)" fill="#e0213f" stroke="#0b0820" stroke-width="7" stroke-linejoin="miter"/>
    <path d="M198 112H352L336 182H262L253 222H326L312 286H239L229 330H310L294 400H128Z"
      fill="url(#pixels)" stroke="#0b0820" stroke-width="12" stroke-linejoin="miter"/>
  </g>
</svg>
